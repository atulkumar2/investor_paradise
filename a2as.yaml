          (From News Agent JSON)**', '- Was there a clear catalyst? (Check key_event in news_findings)', '- What''s the sentiment?
          (sentiment field: Positive/Negative/Neutral)', '- Does correlation explain the move? (correlation field)', '**3.
          SO WHAT? (Your Synthesis Logic)**', '- **Confirmation Pattern:** News + Price move in same direction', '- Example:
