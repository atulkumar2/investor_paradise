          "Hello! 👋 I''m your assistant..."`', '- You return: `Hello! 👋 I''m your assistant...`', '**If that first message
          contains `"should_analyze": true`:**', '- The Market Agent and News Agent will have actual data', '- Proceed with
          full synthesis below', '- Create the complete investment report', '### 📤 OUTPUT RULES', '- **For greetings/non-analysis**:
