models:
  entry_model:
    type: literal
    agents: [agent.create_entry_router_root]
  market_model:
    type: literal
    agents: [market_agent]
  merger_model:
    type: literal
    agents: [merger_agent]
  news_model:
    type: literal
    agents: [pdf_news_scout, web_news_researcher]

tools:
  analyze_risk_metrics:
    type: function
    agents: [market_agent]
    params:
      module: tools.analyze_risk_metrics
      description: |-
        Advanced risk analysis for a stock: max drawdown, Sharpe-like metrics, volatility trends.

        Args:
            symbol: Stock symbol
            start_date: Optional start date in YYYY-MM-DD format
            end_date: Optional end date in YYYY-MM-DD format

        Returns:
            Dictionary with comprehensive risk assessment including max drawdown,
            volatility analysis, and risk-adjusted returns
  analyze_stock:
    type: function
    agents: [market_agent]
    params:
      module: tools.analyze_stock
      description: |-
        Comprehensive analysis of a single stock over a period.

        Args:
            symbol: Stock symbol (e.g., 'RELIANCE', 'TCS')
            start_date: Optional start date in YYYY-MM-DD format
            end_date: Optional end date in YYYY-MM-DD format

        Returns:
            Dictionary with comprehensive stock analysis including price,
            technical, risk, and momentum metrics

        If dates not provided, analyzes the last 30 days of available data.
  check_data_availability:
    type: function
    agents: [market_agent, agent.create_entry_router_root]
    params:
      module: tools.check_data_availability
      description: |-
        Returns the start and end dates of the available data in the database.
        ALWAYS call this FIRST to understand what data is available.

        This tells you:
        - What 'Today', 'Yesterday', or 'Last Week' means in context of this data
        - The actual date range you can query
  compare_stocks:
    type: function
    agents: [market_agent]
    params:
      module: tools.compare_stocks
      description: |-
        Side-by-side comparison of multiple stocks over the same period.

        Args:
            symbols: List of stock symbols (e.g., ['RELIANCE', 'TCS', 'HDFCBANK'])
            start_date: Optional start date in YYYY-MM-DD format
            end_date: Optional end date in YYYY-MM-DD format

        Returns:
            Dictionary with comparative analysis of all stocks

        If dates not provided, uses last 30 days.
  detect_breakouts:
    type: function
    agents: [market_agent]
    params:
      module: tools.detect_breakouts
      description: |-
        Detect stocks that are breaking out (hitting new highs with strong momentum).

        Args:
            start_date: Optional start date in YYYY-MM-DD format
            end_date: Optional end date in YYYY-MM-DD format
            threshold: Minimum return % to qualify as breakout (default 10%)

        Returns:
            Dictionary with list of stocks showing price breakouts and strong momentum
  detect_reversal_candidates:
    type: function
    agents: [market_agent]
    params:
      module: tools.detect_reversal_candidates
      description: |-
        Find oversold stocks showing early reversal signs (for contrarian plays).

        Args:
            lookback_days: Period for analysis (default 30 days)
            top_n: Number of candidates to return (default 15)

        Returns:
            Dictionary with stocks that dropped significantly but showing reversal signals

        Reversal signals: Large decline + recent consecutive up days + volume increase
  detect_volume_surge:
    type: function
    agents: [market_agent]
    params:
      module: tools.detect_volume_surge
      description: |-
        Detect unusual volume activity by comparing recent volume to historical average.

        Args:
            symbol: Stock symbol (e.g., 'RELIANCE', 'TCS')
            lookback_days: Number of days to use for average calculation (default 20)

        Returns:
            Dictionary with volume analysis showing if current volume is
            significantly higher than average
            (indicates potential breakout, news event, or institutional activity)
  find_momentum_stocks:
    type: function
    agents: [market_agent]
    params:
      module: tools.find_momentum_stocks
      description: |-
        Find stocks with strong momentum (consecutive up days + positive returns).

        Args:
            min_return: Minimum return % over last 10 days (default 5%)
            min_consecutive_days: Minimum consecutive up days (default 3)
            top_n: Number of stocks to return (default 15)

        Returns:
            Dictionary with stocks showing sustained upward momentum
  get_52week_high_low:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_52week_high_low
      description: |-
        Find stocks near their 52-week highs or lows (critical psychological levels).

        Args:
            symbols: Optional list of symbols to check (if None, scans all stocks)
            top_n: Number of stocks to return (default 20)

        Returns:
            Dictionary with stocks trading near 52-week highs (breakout candidates)
            or lows (reversal plays)

        When specific symbols are provided: Returns 52-week data for ALL requested symbols
        When symbols=None: Returns only stocks near 52-week high (within 5%) or low (within 10%)
  get_company_name:
    type: function
    agents: [pdf_news_scout]
    params:
      module: tools.get_company_name
  get_delivery_momentum:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_delivery_momentum
      description: |-
        Find stocks with consistently high delivery percentage (institutional buying).

        Args:
            start_date: Optional start date in YYYY-MM-DD format
            end_date: Optional end date in YYYY-MM-DD format
            min_delivery: Minimum average delivery % threshold (default 50%)

        Returns:
            Dictionary with list of stocks showing strong institutional interest

        High delivery % (>50%) indicates institutions are taking delivery, not just trading.
  get_index_constituents:
    type: function
    agents: [market_agent, agent.create_entry_router_root]
    params:
      module: tools.get_index_constituents
      description: |-
        Get list of stock symbols in a given NSE index.

        Args:
            index_name: Index name (e.g., "NIFTY50", "NIFTY100", "NIFTYBANK")

        Returns:
            List of stock symbols in the index

        Example:
            >>> get_index_constituents("NIFTY50")
            ['RELIANCE', 'TCS', 'HDFCBANK', ...]
  get_market_cap_category:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_market_cap_category
      description: |-
        Get market cap category for a stock symbol.

        Args:
            symbol: Stock symbol

        Returns:
            "LARGE", "MID", "SMALL", or None if not classified
  get_sector_from_index:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_sector_from_index
      description: |-
        Get the sectoral index name for a given sector.

        Args:
            sector: Sector name (e.g., 'Banking', 'IT', 'Auto')

        Returns:
            Index name if sector has a dedicated index, None otherwise

        Example:
            >>> get_sector_from_index('Banking')
            'NIFTYBANK'
  get_sector_stocks:
    type: function
    agents: [market_agent, agent.create_entry_router_root]
    params:
      module: tools.get_sector_stocks
      description: |-
        Get list of stock symbols belonging to a sector (using CSV mapping).
        Case-insensitive sector matching.

        Args:
            sector: Sector name (e.g., 'Banking', 'IT', 'Auto', 'FMCG')

        Returns:
            List of stock symbols in the sector
  get_sector_top_performers:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_sector_top_performers
      description: |-
        Get top performing stocks from a specific sector.

        Args:
            sector: Sector name. Supported sectors (31 total):
                    Banking, IT, Automobile, Auto Ancillary, Pharma, Healthcare,
                    Biotechnology, FMCG, Consumer Durables, Consumer Services,
                    Construction Materials, Capital Goods, Construction,
                    Metals & Mining, Power, Oil Gas & Consumable Fuels,
                    Petrochemicals, Chemicals, Fertilizers, Media, Telecom,
                    Realty, Services, Textiles, Forest Materials, Agri,
                    Utilities, Financial Services, Consumer Goods, Diversified, Energy
            start_date: Start date in YYYY-MM-DD format (optional)
            end_date: End date in YYYY-MM-DD format (optional)
            top_n: Number of top stocks to return (default 5)

        Returns:
            Dictionary with sector performers, period info, and summary statistics

        Examples:
            >>> get_sector_top_performers("Banking", "2025-10-01", "2025-11-01", 5)
            >>> get_sector_top_performers("Construction Materials", None, None, 10)
            >>> get_sector_top_performers("IT", "2025-10-01", "2025-11-01", 5)
  get_sectoral_indices:
    type: function
    agents: [market_agent, agent.create_entry_router_root]
    params:
      module: tools.get_sectoral_indices
      description: |-
        Get mapping of sectors to their NSE sectoral index names.

        Note: Only sectors with dedicated NSE indices are mapped here.
        Other sectors (like Construction Materials, Textiles, etc.) are supported
        through CSV-based sector_mapping and will work with get_sector_stocks().

        Returns:
            Dictionary mapping sector category to index name

        Example:
            >>> get_sectoral_indices()
            {'Banking': 'NIFTYBANK', 'IT': 'NIFTYIT', 'Auto': 'NIFTYAUTO', ...}
  get_stocks_by_market_cap:
    type: function
    agents: [market_agent, agent.create_entry_router_root]
    params:
      module: tools.get_stocks_by_market_cap
      description: |-
        Get list of stocks by market cap category.

        Args:
            market_cap: Category - "LARGE", "MID", or "SMALL"

        Returns:
            List of stock symbols in the category

        Example:
            >>> get_stocks_by_market_cap("SMALL")
            ['SYMBOL1', 'SYMBOL2', ...]
  get_stocks_by_sector_and_cap:
    type: function
    agents: [market_agent, agent.create_entry_router_root]
    params:
      module: tools.get_stocks_by_sector_and_cap
      description: |-
        Get list of stock symbols filtered by both sector AND market cap.

        Args:
            sector: Sector name (e.g., 'Banking', 'IT', 'Automobile', 'Pharma')
            market_cap: Market cap category - "LARGE", "MID", or "SMALL"

        Returns:
            List of stock symbols matching both criteria

        Example:
            >>> get_stocks_by_sector_and_cap('Automobile', 'LARGE')
            ['MARUTI', 'TATAMOTORS', 'M&M', ...]
  get_stocks_by_sector_index:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_stocks_by_sector_index
      description: |-
        Get stock symbols from a sector's NSE sectoral index.
        This provides authoritative sector classification from NSE.

        Args:
            sector: Sector name (e.g., 'Banking', 'IT', 'Auto', 'Pharma')

        Returns:
            List of stock symbols in the sectoral index

        Example:
            >>> get_stocks_by_sector_index('Banking')
            ['HDFCBANK', 'ICICIBANK', 'AXISBANK', ...]
  get_top_gainers:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_top_gainers
      description: |-
        Get top performing stocks by percentage return over a period.

        Args:
            start_date: Start date in YYYY-MM-DD format (optional)
            end_date: End date in YYYY-MM-DD format (optional)
            top_n: Number of top stocks to return (default 10)

        Returns:
            Dictionary with period info, top gainers list, and summary statistics

        If dates are not provided, defaults to the last 7 days of available data.
  get_top_losers:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_top_losers
      description: |-
        Get worst performing stocks by percentage return over a period.

        Args:
            start_date: Start date in YYYY-MM-DD format (optional)
            end_date: End date in YYYY-MM-DD format (optional)
            top_n: Number of bottom stocks to return (default 10)

        Returns:
            Dictionary with period info, top losers list, and summary statistics

        If dates are not provided, defaults to the last 7 days of available data.
  get_volume_price_divergence:
    type: function
    agents: [market_agent]
    params:
      module: tools.get_volume_price_divergence
      description: |-
        Detect volume-price divergence (price up but volume down = weak rally, and vice versa).

        Args:
            min_divergence: Minimum divergence % between price and volume trends (default 20%)
            top_n: Number of stocks to return (default 15)

        Returns:
            Dictionary with stocks showing significant volume-price divergence (warning signals)

        Bearish divergence: Price rising but volume declining (rally losing steam)
        Bullish divergence: Price falling but volume increasing (accumulation)
  google_search:
    type: module
    agents: [web_news_researcher]
  list_available_indices:
    type: function
    agents: [market_agent, agent.create_entry_router_root]
    params:
      module: tools.list_available_indices
      description: |-
        List all available NSE indices and their constituent counts.

        Returns:
            Dictionary mapping index name to number of constituents

        Example:
            >>> list_available_indices()
            {'NIFTY50': 50, 'NIFTY100': 100, 'NIFTYBANK': 12, ...}
  list_available_tools:
    type: function
    agents: [market_agent]
    params:
      module: tools.list_available_tools
      description: |-
        Lists all available analysis tools with brief descriptions.
        Use this when user asks 'what can you do?' or 'what tools do you have?'

        Returns:
            Formatted list of all available tools and their purposes
  load_collections_for_date_range:
    type: function
    agents: [pdf_news_scout]
    params:
      module: tools.load_collections_for_date_range
  semantic_search:
    type: function
    agents: [pdf_news_scout]
    params:
      module: tools.semantic_search

teams:
  entry_router:
    type: hierarchy
    agents: [entry_router, analysis_pipeline]
  news_intelligence_agent:
    type: parallel
    agents: [news_intelligence_agent, pdf_news_scout, web_news_researcher]
  pipeline:
    type: sequential
    agents: [pipeline, market_agent, news_intelligence_agent, merger_agent]

