      function: create_entry_router_root
      sub_agents: [analysis_pipeline]
  analysis_pipeline:
    type: instance
    params:
      name: AnalysisPipeline
      description: Market Analysis → [PDF News Database || Web News Search] → Final Report
      function: create_analysis_pipeline
      sub_agents: [market_agent, news_intelligence_agent, merger_agent]
  market_agent:
    type: instance
    models: [market_model]
    tools: [list_available_tools, check_data_availability, get_top_gainers, get_top_losers, get_sector_top_performers, analyze_stock,
      get_index_constituents, list_available_indices, get_sectoral_indices, get_sector_from_index, get_stocks_by_sector_index,
      get_stocks_by_market_cap, get_stocks_by_sector_and_cap, get_market_cap_category, get_sector_stocks, detect_volume_surge,
      compare_stocks, get_delivery_momentum, detect_breakouts, get_52week_high_low, analyze_risk_metrics, find_momentum_stocks,
      detect_reversal_candidates, get_volume_price_divergence]
    params:
      name: MarketAnalyst
      instruction: market_prompt
      output_schema: schemas.MarketAnalysisOutput
      output_key: market_analysis
      function: create_analysis_pipeline
  merger_agent:
    type: instance
    models: [merger_model]
    params:
      name: CIO_Synthesizer
      instruction: ['### 🎯 ROLE & IDENTITY', You are the **Chief Investment Officer (CIO)** of 'Investor Paradise'., '###
          ⚠️ STEP 0: CHECK ROUTING DECISION (HIGHEST PRIORITY)', '**LOOK at the FIRST message in the conversation (from EntryRouter
