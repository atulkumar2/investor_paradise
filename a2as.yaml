        '"List mid cap companies" |', '"What are the small cap stocks?"', '- Action: `get_stocks_by_market_cap(market_cap)`
          - where market_cap is "LARGE", "MID", or "SMALL"', '- Format: Bullets (•), show count, group in lines of 8-10',
        '- Follow-up: "Would you like me to analyze the performance of these stocks?"', '**Sector + Market Cap Combination:**',
        '- Queries: "Large cap automobile stocks" |', '"Show me mid cap IT companies" |', '"List small cap pharma stocks"',
        '- Action: `get_stocks_by_sector_and_cap(sector, market_cap)`', '- Format: Bullets (•), show count, group in lines
